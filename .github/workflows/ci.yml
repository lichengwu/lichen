# CI: check gates (never publishes).
# Triggers: PRs and pushes to main.
# Jobs:
#   check — secret scan, structure check, changelog gate, syntax check
#   test  — full sandbox test suite (unit + end-to-end) on Linux and macOS;
#           runs entirely in a temp sandbox (fake HOME + repo copy), never
#           touches the runner's real environment
# Note: no push / release actions here — releases are tag-driven (RELEASING.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structure check
        run: bash scripts/check.sh

      - name: Secret scan (hard patterns fail the build)
        run: bash scripts/redact.sh

      - name: CHANGELOG entry required for skill changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^skills/'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG.md$'; then
              echo "::error::skills/ changed without a CHANGELOG.md entry. Add one at the top under 'Unreleased'."
              exit 1
            fi
          fi
          echo "changelog check passed"

      - name: Syntax check (python 3.9 compatibility)
        run: |
          python3 -m py_compile framework/bin/lichen framework/lib/*.py framework/hooks/*.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sandbox test suite (unit + E2E, fully isolated)
        run: sh scripts/test.sh
