# Release：tag 驱动的发布流水线。
# 触发：push v* tag（见 RELEASING.md）
# 职责：git archive 打 tarball + SHA-256 → 创建 GitHub Release（自动 notes）→ 传资产。
# 原则不变：发布只由人工打 tag 触发；本 workflow 不做任何自动化版本决策。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release tarball
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz -o "lichen-${V}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "lichen-${V}.tar.gz" > "lichen-${V}.tar.gz.sha256"
          cat "lichen-${V}.tar.gz.sha256"

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "lichen ${GITHUB_REF_NAME}" \
            --generate-notes \
            lichen-*.tar.gz lichen-*.tar.gz.sha256
